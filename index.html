<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Editar Endereço - Vinklo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;display=swap" rel="stylesheet"/>
<style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      background-color: #f3f0f9;
      color: #333;
    }

    header {
      background: linear-gradient(to right, #8e24aa, #6a1b9a);
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      height: 50px;
    }

    .text-logo {
      height: 28px;
    }

    .form-container {
      background: #fff;
      margin: 40px auto;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
      max-width: 500px;
    }

    h2 {
      text-align: center;
      color: #6a1b9a;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      transition: border 0.3s;
    }

    input:focus {
      border-color: #8e24aa;
      outline: none;
    }

    .two-columns {
      display: flex;
      gap: 12px;
    }

    .two-columns .form-group {
      flex: 1;
    }

    .btn {
      width: 100%;
      background: linear-gradient(to right, #8e24aa, #6a1b9a);
      border: none;
      color: #fff;
      padding: 14px;
      font-size: 16px;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:hover {
      transform: scale(1.02);
      box-shadow: 0 4px 12px rgba(106, 27, 154, 0.3);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .error, .valid {
      font-size: 13px;
      margin-top: 4px;
      display: none;
    }

    .error {
      color: red;
    }

    .valid {
      color: green;
    }

    @media (max-width: 600px) {
      .two-columns {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
<header>
<div class="logo-container">
<img alt="Logo" class="logo" src="Design_sem_nome-removebg-preview.png"/>
<img alt="Vinklo" class="text-logo" src="vinklo-removebg-preview.png"/>
</div>
</header>
<div class="form-container">
<h2>Editar Endereço</h2>
<div class="two-columns">
<div class="form-group">
<label for="nome">Nome Completo</label>
<input id="nome" name="nome" type="text"/>
</div>
<div class="form-group">
<label for="telefone">Número de Telefone</label>
<input id="telefone" name="telefone" type="text"/>
</div>
</div>
<div class="form-group">
<label for="cpf">CPF</label>
<input id="cpf" maxlength="14" name="cpf" onblur="validarCPF()" oninput="formatarCPF(this)" type="text"/>
<div class="error" id="cpf-error">CPF inválido</div>
<div class="valid" id="cpf-ok">CPF válido</div>
</div>
<div class="form-group">
<label for="cep">CEP</label>
<input id="cep" maxlength="9" name="cep" onblur="buscarCEP()" type="text"/>

</div>
<div class="form-group">
<label for="cidade">Estado - Cidade</label>
<input id="cidade" name="cidade"="" type="text"/>
</div>
<div class="form-group">
<label for="bairro">Bairro</label>
<input id="bairro" name="bairro" type="text"/>
</div>
<div class="two-columns">
<div class="form-group">
<label for="rua">Rua / Avenida</label>
<input id="rua" name="rua" type="text"/>
</div>
<div class="form-group">
<label for="numero">Número</label>
<input id="numero" name="numero" type="text"/>
</div>
</div>
<div class="form-group">
<label for="complemento">Complemento / Referência</label>
<input id="complemento" name="complemento" type="text"/>
</div>
<button class="btn" onclick="validarFormulario()" type="button">Continuar</button>
</div>
<script>
    function buscarCEP() {
      const cep = document.getElementById('cep').value.replace(/\D/g, '');
      const erro = document.getElementById('cep-error');

      if (cep.length !== 8) {
        erro.style.display = 'block';
        document.getElementById('cidade').value = '';
        return;
      }

      fetch(`https://viacep.com.br/ws/${cep}/json/`)
        .then(response => response.json())
        .then(data => {
          if (data.erro) {
            erro.style.display = 'block';
            document.getElementById('cidade').value = '';
          } else {
            erro.style.display = 'none';
            document.getElementById('cidade').value = `${data.uf} - ${data.localidade}`;
          }
        })
        .catch(() => {
          erro.style.display = 'block';
          document.getElementById('cidade').value = '';
        });
    }

    function formatarCPF(input) {
      let value = input.value.replace(/\D/g, '');
      if (value.length > 11) value = value.slice(0, 11);
      value = value.replace(/(\d{3})(\d)/, '$1.$2');
      value = value.replace(/(\d{3})(\d)/, '$1.$2');
      value = value.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
      input.value = value;
    }

    function validarCPF() {
      const cpfInput = document.getElementById('cpf');
      const cpf = cpfInput.value.replace(/\D/g, '');
      const erro = document.getElementById('cpf-error');
      const ok = document.getElementById('cpf-ok');

      function isValidCPF(cpf) {
        if (cpf.length !== 11 || /^(\d)\1+$/.test(cpf)) return false;
        let sum = 0;
        for (let i = 0; i < 9; i++) sum += parseInt(cpf.charAt(i)) * (10 - i);
        let rest = (sum * 10) % 11;
        if (rest === 10 || rest === 11) rest = 0;
        if (rest !== parseInt(cpf.charAt(9))) return false;
        sum = 0;
        for (let i = 0; i < 10; i++) sum += parseInt(cpf.charAt(i)) * (11 - i);
        rest = (sum * 10) % 11;
        if (rest === 10 || rest === 11) rest = 0;
        return rest === parseInt(cpf.charAt(10));
      }

      if (isValidCPF(cpf)) {
        erro.style.display = 'none';
        ok.style.display = 'block';
      } else {
        erro.style.display = 'block';
        ok.style.display = 'none';
      }
    }
  
function validarFormulario() {
  const camposObrigatorios = ['nome', 'telefone', 'cpf', 'cep', 'cidade', 'bairro', 'rua', 'numero'];
  let formularioValido = true;

  camposObrigatorios.forEach(id => {
    const campo = document.getElementById(id);
    if (!campo.value.trim()) {
      campo.style.border = '2px solid red';
      formularioValido = false;
    } else {
      campo.style.border = '';
    }
  });

  if (formularioValido) {
    window.location.href = "https://lojavinklo.github.io/confirma-opedido.online/";
  }
}
</script>
</body>
</html>
